name: Horilla Django CI/CD Pipeline

on:
  push:
    branches: [ "1.0" ]

jobs:
  ci:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/horilla_demo
      TAG: latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$TAG .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: $IMAGE_NAME:$TAG
          format: table
          exit-code: "0"  # Set to "1" to fail on high/critical vulnerabilities
          vuln-type: os,library
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:$TAG

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=Horilla-Demo
            -Dsonar.python.version=3.11
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: Deploy via Docker Compose (Remote)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Pulling latest image..."
            docker pull $IMAGE_NAME:$TAG

            echo "Stopping current containers..."
            docker compose -f /home/${{ secrets.REMOTE_USER }}/horilla/docker-compose.yml down || true

            echo "Starting services with Docker Compose..."
            docker compose -f /home/${{ secrets.REMOTE_USER }}/horilla/docker-compose.yml up -d --build

            echo "Deployment complete."
